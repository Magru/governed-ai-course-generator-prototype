name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  guarantees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyyaml pytest z3-solver pyDatalog boto3
      - name: install the engines that are not pip packages
        run: |
          curl -sSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog-nox

      # Runs before anything else: a fixture carrying a name that is not ours
      # must never reach a public repository, and the check that prevents it
      # must never be the one that got skipped.
      - name: no borrowed names in fixtures
        run: python tools_allowlist_scan.py

      - name: the prototype runs the published specification
        run: python tools_model_sync.py verify --remote

      # No credentials are configured for this job on purpose. If a test could
      # reach an account from CI, it could reach one from a laptop.
      - name: every engine answers
        run: |
          opa check engines/opa/policy.rego
          python -c "import z3, pyDatalog"

      - name: tests
        run: python -m pytest tests -q -m "not live"

      # The five refusals, each from the engine that owns it. If a layer stops
      # refusing, this fails here rather than at a defence.
      - name: the five refusals
        run: python scenarios/refusals.py
