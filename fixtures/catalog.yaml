# what the platform offers an author. a skill the outline invents is not here,
# and that is what makes the grounding check able to refuse.
catalog:
  version: cat-7
  skills:
    - {id: bench-safety, label: Bench safety}
    - {id: tool-inspection, label: Tool inspection}
    - {id: hand-plane-setup, label: Hand plane setup}
    - {id: chisel-sharpening, label: Chisel sharpening}
    - {id: dust-extraction, label: Dust extraction}
    - {id: noise-exposure, label: Noise exposure}
    - {id: first-aid-basics, label: First aid basics}
    - {id: lifting-technique, label: Lifting technique}
    - {id: machine-guarding, label: Machine guarding}
    - {id: waste-disposal, label: Waste disposal}
    - {id: ppe-selection, label: Ppe selection}
    - {id: incident-reporting, label: Incident reporting}

  # a block row carries what the platform's registry carries, plus the two the
  # specification adds: what a guardrail must inspect, and whether a person has
  # to look at it before approval.
  # A text field must carry a letter or a digit (not an underscore, not a filler); an answer option or a checklist item
  # need only a visible character — "<", "=", "—" and "✓" are real options, and
  # an invisible one (a zero-width space) is not.
  blocks:
    - id: heading
      category: text
      interactive: false
      kb: true
      modality: text
      requires_visual_review: false
      schema: {type: object, required: [text], properties: {text: {type: string, minLength: 1, pattern: "[^\\W_\\u115f\\u1160\\u3164\\uffa0]"}}}
    - id: paragraph
      category: text
      interactive: false
      kb: true
      modality: text
      requires_visual_review: false
      schema:
        type: object
        required: [text, cites]
        properties:
          text: {type: string, minLength: 1, pattern: "[^\\W_\\u115f\\u1160\\u3164\\uffa0]"}
          cites: {type: array, items: {type: string}, minItems: 1}
    - id: image
      category: image
      interactive: false
      kb: true
      modality: image
      requires_visual_review: true
      schema:
        type: object
        required: [src, alt, caption, cites]
        properties:
          src: {type: string, minLength: 1, pattern: "[^\\W_\\u115f\\u1160\\u3164\\uffa0]"}
          alt: {type: string, minLength: 1, pattern: "[^\\W_\\u115f\\u1160\\u3164\\uffa0]"}
          caption: {type: string, minLength: 1, pattern: "[^\\W_\\u115f\\u1160\\u3164\\uffa0]"}
          cites: {type: array, items: {type: string}, minItems: 1}
    - id: checklist
      category: text
      interactive: false
      kb: true
      modality: text
      requires_visual_review: false
      schema:
        type: object
        required: [items]
        properties: {items: {type: array, items: {type: string, minLength: 1, pattern: "[^\\s\\u00ad\\u034f\\u115f\\u1160\\u17b4\\u17b5\\u180b-\\u180f\\u200b-\\u200f\\u202a-\\u202e\\u2060-\\u206f\\u0300-\\u036f\\u061c\\u2800\\u3164\\ufe00-\\ufe0f\\uffa0\\ufeff\\U000e0000-\\U000e007f]"}, minItems: 1}}
    - id: quiz
      category: assessment
      interactive: true
      kb: true
      modality: text
      requires_visual_review: false
      schema:
        type: object
        required: [question, options, answer, points]
        properties:
          question: {type: string, minLength: 1, pattern: "[^\\W_\\u115f\\u1160\\u3164\\uffa0]"}
          options: {type: array, items: {type: string, minLength: 1, pattern: "[^\\s\\u00ad\\u034f\\u115f\\u1160\\u17b4\\u17b5\\u180b-\\u180f\\u200b-\\u200f\\u202a-\\u202e\\u2060-\\u206f\\u0300-\\u036f\\u061c\\u2800\\u3164\\ufe00-\\ufe0f\\uffa0\\ufeff\\U000e0000-\\U000e007f]"}, minItems: 2, uniqueItems: true}
          answer: {type: integer}
          points: {type: integer}
    - id: callout
      category: text
      interactive: false
      kb: true
      modality: text
      requires_visual_review: false
      schema: {type: object, required: [text], properties: {text: {type: string, minLength: 1, pattern: "[^\\W_\\u115f\\u1160\\u3164\\uffa0]"}}}
