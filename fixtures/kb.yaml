# the knowledge base a node may cite.
#
# visibility is NOT modelled here as a rule. the specification is explicit that
# the generator must not re-implement the platform's predicate — it asks the
# platform and treats the answer as a fact. so what a fixture carries is the
# platform's *answer*, resolved per audience, and nothing about how it was
# reached. a fixture that encoded the seven clauses would be the copy that
# drifts, deciding who sees restricted material.
knowledge_base:
  version: kb-4
  chunks:
    - {id: mt-kb-001, text: keep the bench clear of offcuts and wipe spills before starting work}
    - {id: mt-kb-002, text: check a tool for splits and loose handles before every use}
    - {id: mt-kb-003, text: set the plane iron so a thin shaving lifts evenly across the mouth}
    - {id: mt-kb-004, text: hone a chisel until the edge no longer catches on a thumbnail}
    - {id: mt-kb-005, text: connect extraction before cutting and empty the bag at the end of a run}
    - {id: mt-kb-006, text: wear defenders where a machine runs above the daily limit}
    - {id: mt-kb-007, text: report every injury on the day it happens however small it looks}
    - {id: mt-kb-008, text: incident records name the people involved and are held by the supervisor only}
    - {id: mt-kb-009, text: lift with the load close to the body and turn with the feet not the waist}
    - {id: mt-kb-010, text: a guard removed for setting up is refitted before the machine is started}

# an article is the thing permissions are actually attached to. a chunk is a
# fragment of one, and it is retrieved and cited individually — which is why the
# derivation path has four steps and not three: the node cites a chunk, the
# chunk belongs to an article, and the article is what an audience may or may
# not see.
articles:
  - {id: mt-art-bench-and-lifting,  chunks: [mt-kb-001, mt-kb-009]}
  - {id: mt-art-tool-inspection,    chunks: [mt-kb-002]}
  - {id: mt-art-plane-setup,        chunks: [mt-kb-003]}
  - {id: mt-art-sharpening,         chunks: [mt-kb-004]}
  - {id: mt-art-dust-extraction,    chunks: [mt-kb-005]}
  - {id: mt-art-noise-exposure,     chunks: [mt-kb-006]}
  - {id: mt-art-injury-reporting,   chunks: [mt-kb-007]}
  - {id: mt-art-incident-records,   chunks: [mt-kb-008]}
  - {id: mt-art-machine-guarding,   chunks: [mt-kb-010]}

# the platform's answer to "can every member of this audience see this article",
# already resolved. the generator asks; it does not derive.
#
# an earlier version of this file listed chunks here. that read as though the
# platform answered per fragment, and it hid the hop the refusal is supposed to
# name. the chunk-level answer is not written down at all now — it follows from
# the article, and it follows inside the datalog rule where a reader can see it
# is a rule.
resolved_visibility:
  source: platform predicate, asked per audience per article, answer treated as fact
  all-staff:      [mt-art-bench-and-lifting, mt-art-tool-inspection,
                   mt-art-dust-extraction, mt-art-injury-reporting]
  workshop-floor: [mt-art-bench-and-lifting, mt-art-tool-inspection,
                   mt-art-plane-setup, mt-art-sharpening, mt-art-dust-extraction,
                   mt-art-noise-exposure, mt-art-injury-reporting,
                   mt-art-machine-guarding]
  apprentices:    [mt-art-bench-and-lifting, mt-art-tool-inspection,
                   mt-art-plane-setup, mt-art-dust-extraction,
                   mt-art-injury-reporting]
  supervisors:    [mt-art-bench-and-lifting, mt-art-tool-inspection,
                   mt-art-dust-extraction, mt-art-noise-exposure,
                   mt-art-injury-reporting, mt-art-incident-records]
