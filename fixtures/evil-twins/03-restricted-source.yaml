# datalog refuses with the path: node to source to the audience that lacks
# rights. the chunk is one the platform's predicate does not return for
# apprentices, and the course asks the harder question — is there any source
# here that some member of the audience cannot see.
expect:
  refused_by: datalog
  layer: Datalog
  guard: no_permission_leak(scope)
  ends: NodeRepair
  artifact: leak-path
brief:
  id: mt-course-103
  title: incident reporting for apprentices
  audience: [apprentices]
  objectives: [incident-reporting]
  nodes:
    - {id: mt-node-103, type: topic, skill: incident-reporting, cites: [mt-kb-008]}
