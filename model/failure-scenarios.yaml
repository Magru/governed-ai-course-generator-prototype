artifact: failure-scenarios
question: "How do we fail safely?"
owner: "system architect"
updated_when: "a failure mode is discovered, or a situation changes its outcome"
source: "states.html §5 (nine situations) and safety.html §10 (failure matrix)"
generated: "2026-09-02"
generator: "model/export-model.py"

situations:  # 9, each walked event by event
  - situation: "The brief asks for a forbidden topic"
    course: "BriefValidation → BlockedFinal"
    node: "none exist yet"
    also_changes: "Guardrail verdict and its reason land in the trace; the model is never called, so no model or token is recorded"
    editor_next: "Read the reason; start a new brief. This course is closed for good"
  - situation: "The brief contradicts itself"
    course: "BriefFeasibility → BlockedRecoverable"
    node: "none exist yet"
    also_changes: "The contradicting requirements are named and stored with the course; still no generation spend"
    editor_next: "Loosen one of the named requirements and resubmit — the course returns to BriefValidation"
  - situation: "The proposed skeleton invents a skill"
    course: "OutlineChecks → OutlineRepair → OutlineDrafting"
    node: "none exist yet"
    also_changes: "repair_count +1 on the course; the ungrounded skill and the explanation are fed into the next prompt"
    editor_next: "Nothing — watch, or abort. Only after two failed repairs does the course stop and ask"
  - situation: "A node's content cites nothing"
    course: "stays ContentInProgress"
    node: "NodeChecks → NodeRepair → ContentDrafting"
    also_changes: "repair_count +1 on that node only; other nodes are untouched and stay approved"
    editor_next: "Nothing yet — the loop is bounded and will either fix it or hand it back"
  - situation: "A node reaches for a restricted source"
    course: "stays ContentInProgress"
    node: "NodeChecks → NodeRepair; once the repair budget is spent the node stops there and the revision goes to BlockedRecoverable"
    also_changes: "The leak path is recorded: node → source → the audience that lacks rights. The source is excluded from this node's retrieval on retry"
    editor_next: "Narrow the audience, or accept the node without that source"
  - situation: "Generation times out"
    course: "stays ContentInProgress"
    node: "ContentDrafting → NodeRecovery"
    also_changes: "The idempotency_key is checked before anything else: if the write landed, the node moves on; if it did not, one bounded retry follows"
    editor_next: "Nothing — a timeout is an unknown, and the machine resolves it without asking"
  - situation: "An approved topic is edited, before publication"
    course: "ReadyForReview → ContentInProgress"
    node: "edited node → NeedsRevalidation; its exam and its images follow"
    also_changes: "Approvals are withdrawn from all of them, with the reason “dependency changed” and a pointer to the edit"
    editor_next: "Re-run the affected nodes; the course cannot be published while any of them is stale"
  - situation: "An approved topic is edited, after publication"
    course: "the live revision does not move; a fork enters ContentInProgress"
    node: "in the fork only — the live revision's nodes are untouchable"
    also_changes: "ReviseRequested copies every node with its stamps; the cascade then runs inside the fork"
    editor_next: "Work on the fork. Learners keep reading the live revision until the fork is approved and the pointer moves"
  - situation: "A policy changes after publication"
    course: "Published → StaleReview"
    node: "none — no node in a published revision may change"
    also_changes: "Revisions stamped with the old policy version are found by the dependency graph; untouched ones keep serving"
    editor_next: "Nothing, unless it fails: a compliant revision returns to Published re-stamped, a non-compliant one goes to Withdrawn and needs a fixing revision"

failure_modes:  # 14
  - mode: "Wrong action"
    looks_like: "Publishing when the editor asked for a preview"
    stopped_by: "The transition table — publication has an event of its own"
    owner: "State machine"
  - mode: "Bad arguments"
    looks_like: "A block with fields the catalog does not define"
    stopped_by: "Schema validation, extra fields rejected"
    owner: "JSON Schema"
  - mode: "Unauthorized resource"
    looks_like: "A course for an audience this editor cannot author for"
    stopped_by: "Resource-level authorization, not just role"
    owner: "OPA"
  - mode: "Over-agency"
    looks_like: "Generating the whole course when asked for one lesson"
    stopped_by: "Actions are per-node and per-request; nothing batches on its own"
    owner: "Registry"
  - mode: "Duplicate side effect"
    looks_like: "A node generated twice after a timeout"
    stopped_by: "Idempotency key, recorded before the call"
    owner: "State store"
  - mode: "Output injection"
    looks_like: "A source instructing the model"
    stopped_by: "Untrusted position, admission screen, recorded attempt"
    owner: "Guardrail"
  - mode: "Secret leakage"
    looks_like: "A credential echoed in a provider error"
    stopped_by: "Secret detection before context admission"
    owner: "Scanner"
  - mode: "Unsafe retry"
    looks_like: "Re-issuing after a timeout"
    stopped_by: "Status check by key first; retry is bounded"
    owner: "State machine"
  - mode: "Bad context admission"
    looks_like: "Raw retrieval pasted into the prompt"
    stopped_by: "Admission control and summarization"
    owner: "Guardrail"
  - mode: "No audit"
    looks_like: "An incident that cannot be reconstructed"
    stopped_by: "One trace per course, every action in it"
    owner: "Temporal logic"
  - mode: "Infeasible request"
    looks_like: "A brief whose numbers cannot all hold at once"
    stopped_by: "Satisfiability before the first token, with the conflicting requirements named"
    owner: "Z3"
  - mode: "Ungrounded claim"
    looks_like: "A sentence in a lesson with no source behind it"
    stopped_by: "Grounding over the citation graph — a claim without a chunk is not a claim"
    owner: "Datalog"
  - mode: "Permission leak"
    looks_like: "A node citing a document this audience may not see"
    stopped_by: "The leak path, derived rather than asserted"
    owner: "Datalog"
  - mode: "Unmet objective"
    looks_like: "A course that never teaches what it promised to"
    stopped_by: "Coverage, refused with a proof tree naming the gap"
    owner: "Prolog"
