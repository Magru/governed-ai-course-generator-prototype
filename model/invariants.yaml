artifact: invariants
question: "What must be true of every trace this system produces, and what does each rule forbid?"
owner: "system architect"
updated_when: "an invariant is added, weakened, or its checking point moves"
source: "states.html §8 — formulas reproduced verbatim; layers.html §7 for how they are evaluated"
authored: "2026-08-24"
# The most load-bearing content of the whole project, and it was missing from
# this package until now: a model that cannot express the properties the system
# guarantees is missing its point. Formulas are copied character for character
# from the specification and linted against it — the meaning and forbids lines
# are a reading of them.
#
# Operators, over a FINITE trace:
#   G φ   φ holds at every step             F φ   φ holds at some later step
#   X φ   φ holds at the next step          O φ   φ held at some earlier step
#   φ U ψ φ holds until ψ does
#
# Evaluated by replaying the audit trace. Today that happens once per revision,
# at WholeCourseChecks — see open_questions.

count: 15
evaluated_at: "WholeCourseChecks, by replaying the trace for the revision"
evaluated_by: "temporal logic layer — no model checker; a finite trace is walked"
refusal_artifact: "the violated formula and the event that broke it"

invariants:
  - id: I1
    formula: "G(content_generated(N) → course_state = ContentInProgress)"
    means: "content only ever appears while the revision is in its content phase"
    forbids: "generating a node against an approved, published or blocked revision"

  - id: I2
    formula: "G(exam_generated(E) → O content_approved(topics(E)))"
    means: "an exam may only be generated after every topic it tests was approved"
    forbids: "an exam that tests material nobody has signed off, or that does not yet exist"

  - id: I3
    formula: "G(published(C) → all_nodes_approved(C) ∧ ¬∃ stale(C))"
    means: "publication requires every node approved and not one of them stale"
    forbids: "shipping a course with an unreviewed or out-of-date node in it"

  - id: I4
    formula: "G(node_edited(N) → X needs_revalidation(N))"
    means: "editing a node moves it to revalidation on the very next step"
    forbids: "an edit that quietly keeps its old approval — this is the cascade's first link"
    note: "the only invariant using X; the transition is immediate, not eventual"

  - id: I5
    formula: "G(removed(N) → O outline_committed_without(N))"
    means: "a node can only be removed after an outline was committed that excludes it"
    forbids: "deleting a node the approved skeleton still calls for"

  - id: I6
    formula: "G(generated(A) → O guardrail_checked(A))"
    means: "nothing generated exists in the record without having been screened first"
    forbids: "admitting model output that never met the guardrail"

  - id: I7
    formula: "G(published(C) → policy_version(C) = current ∨ stale(C) ∨ ¬affected(C))"
    means: >-
      a live course either was judged under the policy in force, or is marked
      stale, or the policy change does not touch it
    forbids: "a course quietly live under a rule that was never applied to it"
    note: "the ∨ ¬affected(C) clause is what stops every policy edit invalidating the catalogue"

  - id: I8
    formula: "G(restricted_chunk_used(N) → O permission_checked(N))"
    means: "restricted material can only be used after rights were checked"
    forbids: "a leak — restricted source reaching an audience without rights to it"

  - id: I9
    formula: "G(action → F audit(action))"
    means: "every action is eventually recorded"
    forbids: "an unlogged side effect"
    note: "the only F: the audit may lag, it may not be skipped. Assumption A-audit-lag bounds the lag."

  - id: I10
    formula: "G(published(R) → G ¬node_edited(R))"
    means: "once a revision is published, no node in it is ever edited again"
    forbids: "mutating live content — an edit forks a new revision instead"
    note: "nested G: immutability holds for the whole remaining trace, not just the next step"

  - id: I11
    formula: "G(live(C) = R → published(R))"
    means: "whatever revision learners see is a published one"
    forbids: "pointing the live course at a draft, a withdrawn or an archived revision"

  - id: I12
    formula: "G(superseded(R) → O ∃R' (successor(R', R) ∧ published(R')))"
    means: "a revision only becomes superseded because a successor was published"
    forbids: "a revision losing the pointer for any other reason"

  - id: I13
    formula: "G(rolled_back_to(R) → O re_verified(R))"
    means: "a revision can only be rolled back to after it re-earned verification"
    forbids: "restoring an old revision as-is — rollback is re-entry through the checks, not a restore"

  - id: I14
    formula: "G(node_held(N) → course_state(rev N) ≠ ContentInProgress)"
    where: "node_held(N) ≡ N in NodeRecovery ∧ ¬retry_budget_left(N)"
    means: "while a node is stuck waiting for a person, its revision is not reporting itself as working"
    forbids: "a course that says it is producing content while one of its nodes has no move left"
    note: >-
      An earlier form of this invariant named BlockedRecoverable as the only
      permitted course state and was false on three traces the tables allow: the
      draft is discarded and archived, the skeleton is revised out from under the
      node, or the block happens while the revision has left the content phase for
      another reason. What is actually claimed is weaker and true — the wait is
      visible one level up, and the revision cannot go on calling itself busy.
      Safety, not liveness: nothing promises the node ever leaves, because that
      waits on a person and the specification bounds no human.

  - id: I15
    formula: "G(published(C) → guardrail_version(C) = current ∨ stale(C) ∨ ¬affected(C))"
    means: >-
      a live course was screened under the guardrail policy in force, or is marked
      stale, or the change does not reach what it says
    forbids: "a course serving under a forbidden-topic rule that was never applied to it"
    note: >-
      The twin of I7 for the other configuration source. They are separate because
      their mechanisms are. Compliance owns both, but the policy bundle is deployed
      OPA source with a review trail, and the guardrail is a definition typed into a
      managed console with its own version history — each moves without the other. An
      earlier draft had only I7 and demonstrated the cascade by firing PolicyChanged
      for a change to a forbidden topic — which is this invariant's event, not that one.

open_questions:
  - "All fifteen are checked once, at review time. Several — I10 especially — could be evaluated on every event, turning a review-time audit into a runtime assertion. That is strictly better and strictly more expensive, and nothing here has measured which are worth it."
  - "I9 is the only F. On a finite trace, F is only meaningful if the trace ends after the audit lands; a run cut short by a crash satisfies nothing. The bound belongs in the audit-lag quality attribute and the two are not yet connected."
  - >-
    The node machine now has its own recovery, so a property about it can finally be
    stated — and none is. The candidate is G(node_recovery(N) → F(¬node_recovery(N))):
    nothing stays in recovery forever. It is not in the list above because the
    specification does not yet claim it, and this file reproduces claims rather than
    inventing them. Worth adding to states.html §8 before the defence.
  - >-
    I12 and the rollback contradict each other, and the contradiction was found by
    implementing them. §7 of transitions.html sets out the legal rollback and ends it
    "rev 1 → Published, rev 2 → Superseded". I12 says a revision only becomes
    superseded because a successor was published — and revision 2 has no successor;
    the pointer went back to its parent. Both statements are in this model. Either
    "superseded" covers losing the pointer for any reason, in which case I12 forbids
    nothing it was written to forbid, or a rollback needs a state of its own. Not a
    thing to decide quietly.
  - >-
    I2 says O(∧ₜ approved(t)) — one past moment at which every topic was approved
    together. That is what it forbids, and it is weaker than what it means: a moment
    in the past satisfies it even if an approval has since been withdrawn, so an exam
    over since-unapproved material passes. The property that would catch it is about
    the present, not the past, and stating it is a change to the model rather than to
    the checker.
