  - event: "(auto)"
    from_raw: "NeedsRevalidation"
    from_kind: state
    from: ["NeedsRevalidation"]
    guard: "¬hand_edited(node)"
    layer: "State store"
    to_raw: "NodeChecks"
    to_kind: state
    to: ["NodeChecks"]
  - event: "OutlineApproved"
    from_raw: "any state but Removed"
    from_kind: expression
    from_expression: "any state but Removed"
    guard: "is_draft_revision ∧ ¬in_outline(node, committed_outline) ∧ reason_given"
    layer: "Human · State store"
    to_raw: "Removed"
    to_kind: state
    to: ["Removed"]

