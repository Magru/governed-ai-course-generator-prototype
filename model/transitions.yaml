    guard: "is_draft_revision"
    layer: "State store"
    to_raw: "NeedsRevalidation"
    to_kind: state
    to: ["NeedsRevalidation"]
  - event: "(dependency changed)"
    from_raw: "NodeApproved"
    from_kind: state
    from: ["NodeApproved"]
    guard: "depends_on(node, edited ∨ removed)"
    layer: "Datalog"
    to_raw: "NeedsRevalidation"
    to_kind: state
    to: ["NeedsRevalidation"]
  - event: "(auto)"
    from_raw: "NeedsRevalidation"
    from_kind: state
    from: ["NeedsRevalidation"]
    guard: "hand_edited(node)"
    layer: "State store"
    to_raw: "OutputGuardrail"
    to_kind: state
